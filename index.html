<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Fundly - Aplikasi pencatatan keuangan pribadi. Lacak pemasukan, pengeluaran, budget, dan target tabungan Anda dengan mudah." />

    <!-- Latar terang & splash langsung tampil (tanpa menunggu CSS/JS) agar tidak pernah layar hitam -->
    <style>
      html, body { margin: 0; background: #F5F5F7; color: #1C1C1E; color-scheme: only light; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .boot img { width: 64px; height: 64px; border-radius: 18px; }
      .boot span { font-size: 13px; color: #6E6E73; }
    </style>

    <!-- Icons: browser tab, iPhone/iPad home screen, Android & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#F5F5F7" />
    <meta name="color-scheme" content="only light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="application-name" content="Fundly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fundly" />
    <!-- "default": konten dimulai di bawah status bar iPhone (tidak tertimpa jam/baterai) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph -->
    <meta property="og:title" content="Fundly - Pencatatan Keuangan Pribadi" />
    <meta property="og:description" content="Lacak pemasukan, pengeluaran, budget, dan target tabungan Anda." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fundly.id" />
    <meta property="og:image" content="/logo.png" />

    <title>Fundly - Pencatatan Keuangan Pribadi</title>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/logo-mark.svg" alt="" /><span>Memuat Fundly...</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
